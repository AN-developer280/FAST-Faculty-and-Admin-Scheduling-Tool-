<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teacher dashboard — FAST</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/FAST Logo.png" type="image/svg+xml">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="output.css">
  <script>
    tailwind.config = {darkMode: 'class'};
    // Apply saved / system theme before the page paints (no flash). Same code on every page.
    try {
      const saved = window.FAST ? FAST.getTheme() : localStorage.getItem('fast-theme');
      const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) { }
  </script>
</head>

<!--
  HOW TO REUSE THIS LAYOUT ON EVERY TEACHER PAGE
  1. Copy: <div id="overlay">, <aside id="sidebar">, the wrapper <div class="lg:pl-64"> with its <header> (top bar), and the <script>.
  2. Put the page content inside <main>. The wrapper's  lg:pl-64  keeps it clear of the fixed sidebar.
  3. Menu items live in the NAV list in the script. Today the links are "#home", "#timetable" ... so everything works
     in this single file. When each page has its own file, change `href` to the real file (e.g. 'timetable.html')
     and put  <body data-page="timetable">  on that page; the matching item is highlighted automatically.
  The top bar (right side) holds the Theme and Logout buttons.
-->

<body
  class="bg-gradient-to-br from-sky-50 via-slate-50 to-cyan-100/70 font-sans text-slate-800 antialiased
             selection:bg-cyan-200 selection:text-sky-900
             dark:from-[#04111f] dark:via-[#06182a] dark:to-[#08304d] dark:text-sky-50 dark:selection:bg-cyan-500/40 dark:selection:text-white"
  data-page="home">

  <!-- Dark overlay behind the sidebar on phones -->
  <div id="overlay" class="fixed inset-0 z-30 hidden bg-slate-900/50 backdrop-blur-sm lg:hidden"></div>

  <!-- ======================= SIDEBAR (fixed) ======================= -->
  <aside id="sidebar" aria-label="Teacher menu" class="fixed inset-y-0 left-0 z-40 flex h-[100dvh] w-64 -translate-x-full flex-col overflow-hidden
              border-r border-white/10 bg-gradient-to-b from-[#0b3f63] via-[#075985] to-[#0e7490]
              text-sky-50 shadow-none transition-transform duration-300 ease-out
              lg:translate-x-0 lg:rounded-r-[1.75rem] lg:shadow-2xl lg:shadow-sky-900/30
              dark:from-[#051a2e] dark:via-[#0a3a55] dark:to-[#0b4a63]">

    <!-- Decoration: corner glows + the same dot grid as the login pages -->
    <div aria-hidden="true" class="pointer-events-none absolute inset-0">
      <div class="absolute -left-20 -top-20 h-64 w-64 rounded-full bg-cyan-300/30 blur-3xl"></div>
      <div class="absolute -bottom-24 -right-16 h-64 w-64 rounded-full bg-blue-400/30 blur-3xl"></div>
      <div class="absolute inset-0 opacity-70"
        style="background-image:radial-gradient(rgba(186,230,253,.28) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%);mask-image:linear-gradient(to bottom,#000,transparent 70%)">
      </div>
    </div>

    <!-- Brand -->
    <div class="relative flex items-center gap-3 px-5 pb-3 pt-5">
      <img src="images/logo.png" alt="FAST"
        class="h-11 w-11 shrink-0 rounded-2xl shadow-lg shadow-cyan-400/40 ring-1 ring-white/30">
      <div class="min-w-0">
        <p class="text-lg font-extrabold leading-tight tracking-[0.22em]">FAST</p>
        <p class="whitespace-nowrap text-[11px] font-medium uppercase tracking-[0.1em] text-cyan-200/80">Teacher portal
        </p>
      </div>
      <button id="closeBtn" type="button" aria-label="Close menu"
        class="ml-auto flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/10 text-lg hover:bg-white/20 lg:hidden">✕</button>
    </div>

    <!-- Teacher card -->
    <div
      class="relative mx-3 mb-1 flex items-center gap-3 rounded-2xl border border-white/15 bg-white/10 p-3 shadow-inner shadow-white/5 backdrop-blur-sm">
      <span id="tAvatar"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-200 to-sky-400 text-sm font-extrabold text-[#06324f] shadow-md shadow-cyan-400/30">AA</span>
      <div class="min-w-0">
        <p id="tName" class="truncate text-sm font-semibold leading-tight">Teacher name</p>
        <p id="tDept" class="truncate text-xs text-cyan-100/80">Department</p>
      </div>
    </div>

    <!-- Menu: scrolls by itself if the screen is short -->
    <nav id="nav" aria-label="Pages"
      class="relative flex-1 space-y-1 overflow-y-auto px-3 py-2
              [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-white/25"></nav>

    <!-- Today card (hidden on short screens so the menu keeps its room) -->
    <div
      class="relative mx-3 mb-4 mt-1 flex items-center gap-3 rounded-2xl border border-white/15 bg-gradient-to-br from-white/15 to-white/5 p-3 [@media(max-height:759px)]:hidden">
      <div
        class="flex h-11 w-11 shrink-0 flex-col items-center justify-center rounded-xl bg-white/90 text-[#075985] shadow-md">
        <span id="tdMonth" class="text-[10px] font-bold uppercase leading-none tracking-wider text-cyan-700">Nov</span>
        <span id="tdDay" class="text-lg font-extrabold leading-tight">3</span>
      </div>
      <div class="min-w-0">
        <p class="text-[10.5px] font-bold uppercase tracking-[0.14em] text-cyan-200/80">Today</p>
        <p id="tdWeek" class="truncate text-sm font-semibold">Tuesday</p>
      </div>
    </div>
  </aside>
  <!-- ===================== /SIDEBAR ===================== -->

  <!-- Page area: everything on your page goes inside an element with  lg:pl-64 -->
  <div class="lg:pl-64">

    <!-- ===================== TOP BAR ===================== -->
    <header
      class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-cyan-600/15 bg-white/70 px-4 backdrop-blur-md sm:px-6 dark:border-sky-300/10 dark:bg-[#06182a]/70">
      <button id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-lg text-white shadow-md shadow-cyan-500/30 lg:hidden">☰</button>

      <h1 class="flex min-w-0 items-center gap-3 text-lg font-extrabold text-sky-900 sm:text-xl dark:text-sky-100">
        <span class="hidden h-6 w-1.5 shrink-0 rounded-full bg-gradient-to-b from-cyan-500 to-blue-600 sm:block"></span>
        <span id="pageTitleText" class="truncate">Home</span>
      </h1>

      <!-- Right side: theme + logout -->
      <div class="ml-auto flex items-center gap-2">
        <button id="themeBtn" type="button" aria-label="Switch theme"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-cyan-600/20 bg-white/70 text-lg shadow-sm transition hover:border-cyan-500 hover:bg-white dark:border-sky-300/20 dark:bg-white/5 dark:hover:bg-white/10">
          <span class="dark:hidden"><i
              class="fa-solid fa-sun text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.7)]"></i></span><span
            class="hidden dark:inline"><i class="fa-solid fa-moon text-white-400"></i></span>
        </button>
        <button id="logoutBtn" type="button" aria-label="Logout"
          class="inline-flex h-10 items-center gap-2 rounded-full border border-cyan-400/40 bg-white/80 px-3 text-sm font-semibold text-sky-600 transition  hover:border-cyan-500  sm:px-4 dark:border-sky-400/30 dark:bg-sky-500/10 dark:text-white dark:hover:bg-sky/20">
          <span><i class="fa-solid fa-right-from-bracket text-sky-900 dark:text-white"></i></span><span
            class="hidden sm:inline ">Logout</span>
        </button>
      </div>
    </header>
    <!-- =================== /TOP BAR =================== -->

    <main class="mx-auto max-w-5xl p-5 sm:p-8">
      <div
        class="rounded-2xl border border-cyan-600/20 bg-white/75 p-6 shadow-sm backdrop-blur dark:border-sky-300/15 dark:bg-[#0b2238]/70">
        <p class="font-semibold text-sky-900 dark:text-sky-100">Your page content goes here.</p>
        <p class="mt-1 text-sm text-slate-600 dark:text-sky-100/70">Scroll this page: the sidebar and the top bar stay
          exactly where they are.</p>
      </div>
      <!-- extra height so the page can scroll (delete these three cards) -->
      <div class="mt-5 h-72 rounded-2xl border border-dashed border-cyan-600/25 dark:border-sky-300/15"></div>
      <div class="mt-5 h-72 rounded-2xl border border-dashed border-cyan-600/25 dark:border-sky-300/15"></div>
      <div class="mt-5 h-72 rounded-2xl border border-dashed border-cyan-600/25 dark:border-sky-300/15"></div>
    </main>
  </div>

  <script src="js/teacher.js"></script>
</body>

</html>
