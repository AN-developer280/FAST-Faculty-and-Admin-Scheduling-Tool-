<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FAST — Faculty and Admin Scheduling Tool</title>
  <meta name="description" content="FAST: timetables, syllabus tracking, diary and attendance for faculty and admin.">
  <link rel="icon" href="images/FAST%20Logo.png" type="image/png">
  <link rel="stylesheet" href="output.css">

  <script>
    // Apply saved / system theme before the page paints (no flash).
    try {
      const saved = localStorage.getItem('fast-theme');
      const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) { }
  </script>
</head>

<body
  class="h-[100dvh] overflow-hidden bg-gradient-to-br from-sky-50 via-slate-50 to-cyan-100/70 font-sans text-slate-800 antialiased
             selection:bg-cyan-200 selection:text-sky-900
             dark:from-[#04111f] dark:via-[#06182a] dark:to-[#08304d] dark:text-sky-50 dark:selection:bg-cyan-500/40 dark:selection:text-white">

  <div class="relative flex h-[100dvh] flex-col overflow-hidden">

    <!-- Background layers (all static) -->
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">

      <!-- Colour glows (corners) -->
      <div class="absolute -left-24 -top-24 h-96 w-96 rounded-full bg-cyan-300/50 blur-3xl dark:bg-cyan-500/25"></div>
      <div
        class="absolute -right-28 top-1/4 h-[30rem] w-[30rem] rounded-full bg-blue-400/35 blur-3xl dark:bg-blue-600/30">
      </div>
      <div class="absolute -bottom-40 left-1/4 h-96 w-96 rounded-full bg-sky-300/40 blur-3xl dark:bg-sky-500/20"></div>

      <!-- Aurora band behind the logo and title -->
      <div class="absolute left-1/2 top-[38%] h-72 w-[min(70rem,120%)] -translate-x-1/2 -translate-y-1/2 rounded-[50%]
                bg-gradient-to-r from-cyan-300/40 via-sky-300/30 to-indigo-300/40 blur-3xl
                dark:from-cyan-400/15 dark:via-sky-400/10 dark:to-indigo-500/20"></div>

      <!-- Flat grid (boxes) with a node on every crossing, fading toward the edges -->
      <div class="absolute inset-0 opacity-80 dark:opacity-100"
        style="background-image:radial-gradient(circle at 0 0,rgba(8,145,178,.55) 2px,transparent 2.6px),linear-gradient(rgba(8,145,178,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(8,145,178,.13) 1px,transparent 1px);background-size:64px 64px;background-position:center;-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 35%,#000 20%,transparent 70%)">
      </div>

      <!-- Dots at the centre of every box -->
      <div class="absolute inset-0 opacity-60 dark:opacity-30"
        style="background-image:radial-gradient(rgba(8,145,178,.25) 1px,transparent 1.5px);background-size:64px 64px;background-position:center;-webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 35%,#000 25%,transparent 72%)">
      </div>

      <!-- Perspective floor: the same grid running away to a horizon -->
      <div class="absolute inset-x-0 bottom-0 h-[44%] overflow-hidden"
        style="-webkit-mask-image:linear-gradient(to bottom,transparent,#000 75%);mask-image:linear-gradient(to bottom,transparent,#000 75%)">
        <div class="absolute left-[-60%] top-0 h-[300%] w-[220%] dark:hidden"
          style="transform-origin:50% 0;transform:perspective(360px) rotateX(66deg);background-image:linear-gradient(rgba(8,145,178,.34) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(8,145,178,.34) 1.5px,transparent 1.5px);background-size:72px 72px;background-position:center top">
        </div>
        <div class="absolute left-[-60%] top-0 hidden h-[300%] w-[220%] dark:block"
          style="transform-origin:50% 0;transform:perspective(360px) rotateX(66deg);background-image:linear-gradient(rgba(34,211,238,.30) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(34,211,238,.30) 1.5px,transparent 1.5px);background-size:72px 72px;background-position:center top">
        </div>
      </div>
      <!-- Horizon glow -->
      <div
        class="absolute inset-x-0 bottom-[44%] h-24 translate-y-1/2 bg-gradient-to-b from-transparent via-cyan-300/25 to-transparent blur-xl dark:via-cyan-400/15">
      </div>

      <!-- Glowing nodes on grid crossings (large screens only) -->
      <div class="hidden lg:block">
        <i
          class="absolute left-[calc(50%-483px)] top-[calc(50%-163px)] h-1.5 w-1.5 rounded-full bg-cyan-500 shadow-[0_0_14px_4px_rgba(34,211,238,.65)]"></i>
        <i
          class="absolute left-[calc(50%-419px)] top-[calc(50%+29px)] h-1.5 w-1.5 rounded-full bg-blue-500 shadow-[0_0_14px_4px_rgba(59,130,246,.6)]"></i>
        <i
          class="absolute left-[calc(50%-355px)] top-[calc(50%-291px)] h-1.5 w-1.5 rounded-full bg-sky-400 shadow-[0_0_14px_4px_rgba(56,189,248,.65)]"></i>
        <i
          class="absolute left-[calc(50%+413px)] top-[calc(50%-227px)] h-1.5 w-1.5 rounded-full bg-cyan-500 shadow-[0_0_14px_4px_rgba(34,211,238,.65)]"></i>
        <i
          class="absolute left-[calc(50%+477px)] top-[calc(50%+1px)] h-1.5 w-1.5 rounded-full bg-blue-500 shadow-[0_0_14px_4px_rgba(59,130,246,.6)]"></i>
        <i
          class="absolute left-[calc(50%+349px)] top-[calc(50%-99px)] h-1.5 w-1.5 rounded-full bg-sky-400 shadow-[0_0_14px_4px_rgba(56,189,248,.65)]"></i>
      </div>

      <!-- Top sheen, thin light line, edge vignette -->
      <div class="absolute inset-x-0 top-0 h-48 bg-gradient-to-b from-white/70 to-transparent dark:from-sky-200/5">
      </div>
      <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-cyan-400/70 to-transparent"></div>
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_55%,rgba(8,145,178,.14)_100%)]
                dark:bg-[radial-gradient(ellipse_at_center,transparent_55%,rgba(0,0,0,.45)_100%)]"></div>
    </div>

    <!-- Top bar -->
    <header class="relative z-10 mx-auto flex w-full max-w-6xl items-center justify-between px-5 py-4 sm:px-8">
      <a href="index.html" class="flex items-center gap-3" aria-label="FAST home">
        <img src="images/FAST%20Logo.png" alt="" class="h-10 w-10 rounded-xl shadow-md shadow-cyan-500/30">
        <span class="text-xl font-extrabold tracking-[0.25em] text-sky-900 dark:text-sky-100">FAST</span>
      </a>
      <button id="themeBtn" type="button" aria-label="Switch theme"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-cyan-600/20 bg-white/70 text-sky-900 shadow-sm backdrop-blur transition hover:border-cyan-500 hover:bg-white dark:border-sky-300/20 dark:bg-white/5 dark:text-cyan-200 dark:hover:bg-white/10">

        <!-- Moon (shown in light mode) -->
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" />
        </svg>

        <!-- Sun (shown in dark mode) -->
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      </button>
    </header>

    <!-- Hero -->
    <main
      class="relative z-10 mx-auto flex min-h-0 w-full max-w-3xl flex-1 items-center justify-center px-5 pb-6 pt-2 text-center">
      <div id="fit" class="flex w-full flex-col items-center">

        <div class="relative">
          <div aria-hidden="true"
            class="absolute inset-0 -z-10 scale-125 rounded-full bg-cyan-400/30 blur-2xl dark:bg-cyan-400/20"></div>
          <img src="images/logo.png" alt="FAST logo"
            class="h-28 w-28 rounded-[1.7rem] shadow-2xl shadow-blue-700/30 ring-1 ring-white/50 sm:h-32 sm:w-32 dark:ring-white/10">
        </div>

        <h1
          class="mt-7 bg-gradient-to-r from-sky-900 via-blue-600 to-cyan-500 bg-clip-text text-6xl font-extrabold leading-none tracking-[0.18em] text-transparent sm:text-7xl dark:from-sky-200 dark:via-cyan-300 dark:to-blue-400">
          FAST
        </h1>
        <p class="mt-3 text-lg font-semibold text-cyan-700 sm:text-xl dark:text-cyan-300">Faculty and Admin Scheduling
          Tool</p>


        <a href="login.html"
          class="group mt-9 inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 px-12 py-3.5 text-lg font-semibold text-white shadow-lg shadow-cyan-500/30 transition hover:-translate-y-0.5 hover:shadow-xl hover:shadow-cyan-500/40 focus:outline-none focus-visible:ring-4 focus-visible:ring-cyan-400/50">
          Login
          <svg class="h-5 w-5 transition group-hover:translate-x-0.5" viewBox="0 0 20 20" fill="currentColor"
            aria-hidden="true">
            <path fill-rule="evenodd"
              d="M3 10a1 1 0 011-1h9.586l-3.293-3.293a1 1 0 111.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L13.586 11H4a1 1 0 01-1-1z"
              clip-rule="evenodd" />
          </svg>
        </a>
        <p class="mt-4 pt-2 text-sm text-slate-600 dark:text-sky-100/70">
          Only users registered by the admin can log in.
        </p>
        <ul class="mt-12 flex flex-wrap items-center justify-center gap-2.5 text-sm">
          <li
            class="inline-flex items-center gap-2 rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">
            <svg class="h-4 w-4 shrink-0 text-cyan-600 dark:text-cyan-300" style="width:1rem;height:1rem"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
              <path d="M3 9.5h18M8 2.5v4M16 2.5v4" />
              <path d="M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01" />
            </svg>Timetable
          </li>
          <li
            class="inline-flex items-center gap-2 rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">
            <svg class="h-4 w-4 shrink-0 text-cyan-600 dark:text-cyan-300" style="width:1rem;height:1rem"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="5" />
              <circle cx="12" cy="12" r="1.2" fill="currentColor" />
            </svg>Syllabus Tracker
          </li>
          <li
            class="inline-flex items-center gap-2 rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">
            <svg class="h-4 w-4 shrink-0 text-cyan-600 dark:text-cyan-300" style="width:1rem;height:1rem"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M12 6.5C10.3 5.2 8 4.7 4 4.7v13c4 0 6.3.5 8 1.8 1.7-1.3 4-1.8 8-1.8v-13c-4 0-6.3.5-8 1.8z" />
              <path d="M12 6.5v13" />
            </svg>Teacher Diary
          </li>
          <li
            class="inline-flex items-center gap-2 rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">
            <svg class="h-4 w-4 shrink-0 text-cyan-600 dark:text-cyan-300" style="width:1rem;height:1rem"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M8 12.5l2.8 2.8L16.5 9.5" />
            </svg>Attendance
          </li>
        </ul>
      </div>
    </main>

    <footer class="relative z-10 py-3 text-center text-xs text-slate-500 dark:text-sky-200/50">
      © <span id="yr"></span> FAST · Faculty and Admin Scheduling Tool
    </footer>
  </div>

  <script src="js/landingPage.js"></script>
</body>

</html>
