 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAST — Faculty and Admin Scheduling Tool</title>
<meta name="description" content="FAST: timetables, syllabus tracking, diary and attendance for faculty and admin.">
<link rel="icon" href="images/FAST Logo.png" type="image/png">
<link rel="stylesheet" href="output.css">
 <script>
  tailwind.config = { darkMode: 'class' };
  // Apply saved / system theme before the page paints (no flash)
  try {
    const saved = localStorage.getItem('fast-theme');
    const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  } catch (e) {}
</script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased dark:bg-[#06182a] dark:text-sky-50">

<div class="relative flex min-h-screen flex-col overflow-hidden">

  <!-- Soft static background: colour glows + fine dot grid -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0">
    <div class="absolute -left-24 -top-24 h-96 w-96 rounded-full bg-cyan-300/40 blur-3xl dark:bg-cyan-500/20"></div>
    <div class="absolute -right-24 top-1/3 h-[28rem] w-[28rem] rounded-full bg-blue-400/30 blur-3xl dark:bg-blue-600/25"></div>
    <div class="absolute -bottom-32 left-1/4 h-80 w-80 rounded-full bg-sky-300/30 blur-3xl dark:bg-sky-500/15"></div>
    <div class="absolute inset-0 opacity-60 dark:opacity-30"
         style="background-image:radial-gradient(rgba(8,145,178,.22) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)"></div>
  </div>

  <!-- Top bar -->
  <header class="relative z-10 mx-auto flex w-full max-w-6xl items-center justify-between px-5 py-4 sm:px-8">
    <a href="#" class="flex items-center gap-3" aria-label="FAST home">
      <img src="images/FAST Logo.png" alt="FAST logo" class="h-10 w-10 rounded-xl shadow-md shadow-cyan-500/30">
      <span class="text-xl font-extrabold tracking-[0.25em] text-sky-900 dark:text-sky-100">FAST</span>
    </a>
    <button id="themeBtn" type="button" aria-label="Switch theme"
            class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-cyan-600/20 bg-white/70 text-lg shadow-sm backdrop-blur transition hover:border-cyan-500 hover:bg-white dark:border-sky-300/20 dark:bg-white/5 dark:hover:bg-white/10">
      <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
    </button>
  </header>

  <!-- Hero -->
  <main class="relative z-10 mx-auto flex w-full max-w-3xl flex-1 flex-col items-center justify-center px-5 pb-16 pt-6 text-center">

    <div class="relative">
      <div aria-hidden="true" class="absolute inset-0 -z-10 scale-125 rounded-full bg-cyan-400/30 blur-2xl dark:bg-cyan-400/20"></div>
      <img src="images/logo.png" alt="FAST logo"
           class="h-28 w-28 rounded-[1.7rem] shadow-2xl shadow-blue-700/30 ring-1 ring-white/50 sm:h-32 sm:w-32 dark:ring-white/10">
    </div>

    <h1 class="mt-7 bg-gradient-to-r from-sky-900 via-blue-600 to-cyan-500 bg-clip-text text-6xl font-extrabold leading-none tracking-[0.18em] text-transparent sm:text-7xl dark:from-sky-200 dark:via-cyan-300 dark:to-blue-400">
      FAST
    </h1>
    <p class="mt-3 text-lg font-semibold text-cyan-700 sm:text-xl dark:text-cyan-300">Faculty and Admin Scheduling Tool</p>
    <!-- <p class="mt-3 max-w-md text-sm leading-relaxed text-slate-600 sm:text-base dark:text-sky-100/70">
      Timetables, syllabus tracking, teacher diary and attendance, all in one place.
    </p> -->

    <a href="login.html"
       class="group mt-9 inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 px-12 py-3.5 text-lg font-semibold text-white shadow-lg shadow-cyan-500/30 transition hover:-translate-y-0.5 hover:shadow-xl hover:shadow-cyan-500/40 focus:outline-none focus-visible:ring-4 focus-visible:ring-cyan-400/50">
      Login
      <svg class="h-5 w-5 transition group-hover:translate-x-0.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M3 10a1 1 0 011-1h9.586l-3.293-3.293a1 1 0 111.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L13.586 11H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
    </a>
    <p class="mt-3 text-xs text-slate-500 dark:text-sky-200/60">Only users registered by the admin can log in.</p>

    <!-- Optional feature chips (delete this block if you want the page even simpler) -->
    <ul class="mt-12 flex flex-wrap items-center justify-center gap-2.5 text-sm">
      <li class="rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">🗓 Timetable</li>
      <li class="rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">🎯 Syllabus Tracker</li>
      <li class="rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">📓 Teacher Diary</li>
      <li class="rounded-full border border-cyan-600/20 bg-white/70 px-4 py-1.5 text-sky-900 shadow-sm backdrop-blur dark:border-sky-300/20 dark:bg-white/5 dark:text-sky-100">✅ Attendance</li>
    </ul>
  </main>

  <footer class="relative z-10 py-5 text-center text-xs text-slate-500 dark:text-sky-200/50">
    © <span id="yr"></span> FAST · Faculty and Admin Scheduling Tool
  </footer>
</div>

<script src="landingPage.js">
 
</script>
</body>
</html>
