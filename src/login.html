<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>FAST | Login</title>
  <meta name="description" content="Sign in to FAST, Faculty and Admin Scheduling Tool.">

  <link rel="icon" href="images/FAST Logo.png" type="image/png">
  <link rel="stylesheet" href="./output.css">
  <link rel="stylesheet" href="style.css">

  <script>
    tailwind.config = { darkMode: 'class' };

    // Apply saved/system theme before page paints
    try {
      const saved = localStorage.getItem('fast-theme');
      const dark = saved
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;

      document.documentElement.classList.toggle('dark', dark);
    } catch (e) { }
  </script>
</head>

<body
  class="relative flex h-dvh flex-col overflow-hidden bg-slate-50 text-slate-800 antialiased dark:bg-[#06182a] dark:text-sky-50">

  <!-- Background gradient -->
  <div aria-hidden="true"
    class="pointer-events-none absolute inset-0 bg-gradient-to-t from-cyan-300/30 via-blue-200/10 to-transparent dark:from-cyan-500/15 dark:via-blue-600/5 dark:to-transparent">
  </div>

  <!-- Header -->
  <header class="relative z-10 mx-auto flex w-full max-w-6xl shrink-0 items-center justify-between px-5 py-3 sm:px-8">

    <a href="#" class="flex items-center gap-3" aria-label="FAST home">
      <img src="images/FAST Logo.png" alt="FAST logo" class="h-10 w-10 rounded-xl shadow-md shadow-cyan-500/30">

      <span class="text-xl font-extrabold tracking-[0.25em] text-sky-900 dark:text-sky-100">
        FAST
      </span>
    </a>

    <!-- Theme toggle -->
    <button id="themeBtn" type="button" aria-label="Switch theme"
      class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-cyan-600/20 bg-white/70 text-lg shadow-sm backdrop-blur transition hover:border-cyan-500 hover:bg-white dark:border-sky-300/20 dark:bg-white/5 dark:hover:bg-white/10">
      <span class="dark:hidden">🌙</span>
      <span class="hidden dark:inline">☀️</span>
    </button>

  </header>

  <!-- Centered Login Form -->
  <main class="relative z-10 flex min-h-0 flex-1 items-center justify-center overflow-hidden px-4 py-2 sm:px-6">

    <section class="flex w-full max-w-lg flex-col items-center justify-center">

      <!-- Graduation cap container -->
      <div
        class="flex h-20 w-24 shrink-0 items-center justify-center rounded-2xl border border-sky-200/60 bg-white shadow-lg shadow-cyan-300 transition-colors duration-300 dark:border-sky-300/20 dark:bg-cyan-300 dark:shadow-sky-400  sm:h-22 sm:w-28">

        <img src="./images/graduation-cap.svg" alt="Graduation Cap" class="cap-icon h-16 w-16 sm:h-20 sm:w-20">
      </div>

      <!-- Form heading -->
      <div class="mb-4 text-center">

        <h1 class="mt-3 text-3xl font-extrabold tracking-tight text-slate-800 dark:text-white sm:text-4xl">
          Sign in to
          <span
            class="bg-gradient-to-r from-cyan-600 to-blue-600 bg-clip-text text-transparent dark:from-cyan-300 dark:to-blue-400">
            FAST
          </span>
        </h1>

        <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-sky-100/60">
          Your schedule, simplified.
        </p>

      </div>

      <!-- Login card -->
      <div
        class="glass-card login-card w-full rounded-3xl border-2 border-blue-500/30 bg-transparent p-5 shadow-xl shadow-cyan-300 hover:shadow-xl   sm:p-7">

        <form id="loginForm" action="#" method="post" novalidate class="space-y-4">

          <!-- Email -->
          <div>
            <label for="email" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-sky-100/90">
              Email Address
            </label>

            <div class="relative">

              <svg
                class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-sky-200/50"
                xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="3" />
                <path d="m3 7 9 6 9-6" />
              </svg>

              <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required
                aria-describedby="emailError"
                class="form-input w-full rounded-xl py-3.5 pl-12 pr-4 text-sm text-slate-800 outline-none transition-all duration-300   dark:text-white">
            </div>

            <p id="emailError" class="mt-1 text-sm text-red-500" role="alert"></p>
          </div>

          <!-- Password -->
          <div>

            <div class="mb-2 flex items-center justify-between gap-3">
              <label for="password" class="text-sm font-semibold text-slate-700 dark:text-sky-100/90">
                Password
              </label>

              <a href="#"
                class="text-xs font-semibold text-cyan-700 transition hover:text-blue-700 dark:text-cyan-300 dark:hover:text-sky-200">
                Forgot password?
              </a>
            </div>

            <div class="relative">

              <svg
                class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-sky-200/50"
                xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="3" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>

              <input id="password" name="password" type="password" placeholder="Enter your password"
                autocomplete="current-password" required aria-describedby="passwordError"
                class="form-input w-full rounded-xl py-3.5 pl-12 pr-12 text-sm text-slate-800 outline-none transition-all duration-300 hover:border-green-400 focus:border-green-400 focus:ring-2 focus:ring-green-400/20 dark:text-white">

              <!-- Show/hide password -->
              <button id="togglePasswordBtn" type="button" aria-label="Show password" aria-controls="password"
                class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 transition hover:text-cyan-600 dark:text-sky-200/50 dark:hover:text-cyan-300">

                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>

              </button>
            </div>

            <p id="passwordError" class="mt-1 text-sm text-red-500" role="alert"></p>
          </div>

          <!-- Remember me -->
          <label for="remember"
            class="flex cursor-pointer items-center gap-2.5 pt-1 text-sm text-slate-600 dark:text-sky-100/65">
            <input id="remember" name="remember" type="checkbox" class="h-4 w-4 rounded accent-cyan-600">
            Remember me
          </label>

          <!-- General validation message -->
          <p id="error" class="text-center text-sm text-red-500" role="alert" aria-live="polite"></p>

          <!-- Sign in button -->
          <button id="submitBtn" type="submit"
            class="login-button group flex w-full items-center justify-center gap-2 rounded-xl py-3.5 text-sm font-bold text-white shadow-lg shadow-sky-500/20 transition-all duration-300 hover:shadow-xl hover:shadow-sky-500/30">

            Sign In

            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="transition-transform duration-200 group-hover:translate-x-1" aria-hidden="true">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>

          </button>

        </form>
        <!-- form end -->

        <!-- Security note -->
        <div
          class="mt-4 flex items-center justify-center gap-2 border-t border-cyan-300 pt-4 dark:border-sky-100/50">

          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
            class="text-cyan-600 dark:text-cyan-300" aria-hidden="true">
            <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z" />
            <path d="m9 12 2 2 4-4" />
          </svg>

          <p class="text-xs text-slate-500 dark:text-sky-100/50">
            Secure access to your FAST account
          </p>

        </div>

      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 shrink-0 py-2 text-center text-xs text-slate-500 dark:text-sky-200/50">
    © <span id="yr">2026</span> FAST · Faculty and Admin Scheduling Tool
  </footer>

  <!-- Existing project JavaScript -->
  <script src="landingPage.js"></script>
  <script src="loginValidation.js"></script>

</body>

</html>
